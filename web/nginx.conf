server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-cache always;
    location = / { return 302 /hand-and-foot/; }
    location = /hand-and-foot { return 301 /hand-and-foot/; }
    location ^~ /api/hand-and-foot/ {
        proxy_pass http://api:5104;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /hand-and-foot/socket.io {
        proxy_pass http://api:5104;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
    location /hand-and-foot/ {
        try_files $uri $uri/ /hand-and-foot/index.html;
    }
    location ~* ^/hand-and-foot/.*\.(?:js|css|svg|png|jpe?g|webp|ico|ttf|woff2?|mp3|ogg|json|txt)$ {
        try_files $uri =404;
    }
    location ~ ^/(api|\.git|\.local|docs)/ { return 404; }
}
