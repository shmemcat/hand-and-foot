name: Release Hand and Foot game server

on:
  push:
    tags: ["game-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing game-vMAJOR.MINOR.PATCH tag to publish
        required: true

concurrency:
  group: handandfoot-game-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the component tag and record its source
        id: revision
        run: |
          [[ "$RELEASE_TAG" =~ ^game-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check version and digest contracts
        run: node --test scripts/component-release.test.mjs
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.11"
      - name: Test the independent service
        working-directory: api
        run: |
          uv sync --locked --group dev
          uv run --locked --group dev python -m pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing versioned image
        run: node scripts/component-release.mjs check "$RELEASE_TAG"
      - name: Build only this component
        uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: ghcr.io/shmemcat/handandfoot-game-api:${{ env.RELEASE_TAG }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            REVISION=${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/shmemcat/hand-and-foot
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Smoke check the isolated image before publishing
        run: |
          docker run --rm "ghcr.io/shmemcat/handandfoot-game-api:$RELEASE_TAG" python -c "from handandfoot_server.application import create_app; app=create_app({'SQLALCHEMY_DATABASE_URI':'sqlite://','SECRET_KEY':'s'*40,'AUTO_CREATE_SCHEMA':False,'START_WORKER':False}); assert app.test_client().get('/health').json['component']=='handandfoot-game'; assert app.test_client().get('/ready').status_code==503"
      - name: Publish the immutable version and record its digest
        run: |
          image="ghcr.io/shmemcat/handandfoot-game-api:$RELEASE_TAG"
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
          node scripts/component-release.mjs record "$RELEASE_TAG" "${{ steps.revision.outputs.sha }}" "$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: handandfoot-game-${{ env.RELEASE_TAG }}
          path: release-artifacts/handandfoot-game.json
          if-no-files-found: error
